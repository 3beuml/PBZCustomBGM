[Keybinds]
; 打开 CustomBGM 菜单的按键（Unreal 键名；不要与游戏或其他 mod 冲突）
MenuToggle = F7

[Switches]
; 全局总开关（菜单里也可以随时切换）
MasterEnabled = 1
; 战斗曲（进战斗循环、脱战淡出）；默认 combat.wav = 6 秒静音文件（不再是"滴滴"测试音）
CombatMusic = 0
; 低血量报警曲（血量低于 LowHealthPercent 触发）
LowHealthMusic = 1
; 死亡曲（血量跌到底触发，复活/读档后延迟 DeathHoldSeconds 再停）
DeathMusic = 1
; 决战曲：Boss（特殊敌人）血量降到 BossLowPercent 触发，锁存播到 Boss 死/脱战；
; 期间低血曲让位不触发。歌源 player.ini [files] boss（留空=沿用低血曲）
BossMusic = 1
; 低血曲粘滞：触发后即使回血也继续播，直到战斗结束才停（1=开，0=回血即停）
LowUntilBattleEnd = 1

[Thresholds]
; 低血量触发阈值（满血的百分比，1~99；F7 面板可 ±5 调节并"保存阈值"写回本行）
LowHealthPercent = 40
; 低血量解除滞回（回血超过 阈值+该值 后停止低血曲，防止临界抖动；粘滞开启时战斗中不生效）
LowHysteresisPercent = 5
; Boss 决战触发阈值（Boss 血量满血的百分比）
BossLowPercent = 25
; 死亡曲在复活/读档后继续多播的秒数（0~120；0=复活立即停）
DeathHoldSeconds = 10
; 哨兵轮询间隔毫秒（50~2000；越小触发越及时、耗电略高）
PollIntervalMs = 200

[Debug]
; 1 = 在 UE4SS.log 记录状态切换明细（排障用，平时保持 0）
StateLog = 0
